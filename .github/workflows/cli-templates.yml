name: CLI template consumers
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/cli-templates.yml
      - create-ridhuan-backend/**
      - .gitmodules
      - .gitattributes
      - .gitignore
      - modular-express-typescript-starter-postgre
      - nestjs
      - modular-golang
      - modular-NET
      - modular-fastapi
      - modular-springboot
      - modular-laravel
  pull_request:
    paths:
      - .github/workflows/cli-templates.yml
      - create-ridhuan-backend/**
      - .gitmodules
      - .gitattributes
      - .gitignore
      - modular-express-typescript-starter-postgre
      - nestjs
      - modular-golang
      - modular-NET
      - modular-fastapi
      - modular-springboot
      - modular-laravel
  workflow_dispatch:
    inputs:
      verification:
        description: Verification stage to run before full release validation
        type: choice
        options: [full, macos-smoke, spring-compose, laravel-compose, nestjs-compose]
        default: full
      publish:
        description: Publish the tested artifact (requires npm trusted publisher)
        type: boolean
        default: false
      spring_scenarios:
        description: Reviewed affected Spring scenarios (comma-separated; empty uses the six portability cases)
        type: string
        default: ''
      laravel_scenarios:
        description: Reviewed affected Laravel scenarios (comma-separated; empty uses Redis quota/cache/outage)
        type: string
        default: ''
permissions:
  contents: read
concurrency:
  group: cli-${{ github.ref }}-${{ github.event_name == 'workflow_dispatch' && inputs.verification || 'full' }}
  cancel-in-progress: true
defaults:
  run:
    working-directory: create-ridhuan-backend
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version: 24.15.0
          cache: npm
          cache-dependency-path: create-ridhuan-backend/package-lock.json
      - run: npm ci
      - run: npm run prepare:templates
      - run: npm run build
      - run: npm run test:hardening:runner
      - run: node --test scripts/test-spring-scenario-selection.mjs
      - run: npm test
      - run: npm pack
      - uses: actions/upload-artifact@v4
        with:
          name: cli-package
          path: create-ridhuan-backend/*.tgz
          if-no-files-found: error
  consumer:
    if: github.event_name != 'workflow_dispatch' || inputs.verification == 'full'
    needs: package
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        os: [ubuntu-latest, windows-latest]
        template: [express-typescript, nestjs, golang, dotnet, fastapi, springboot, laravel]
        database: [postgresql, mysql]
    runs-on: ${{ matrix.os }}
    env:
      CLI_RUNTIME_TEST: ${{ matrix.os == 'ubuntu-latest' && 'true' || 'false' }}
      GOWORK: "off"
      GOMAXPROCS: "2"
      GOMEMLIMIT: 512MiB
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version: 24.15.0
      - uses: actions/setup-go@v5
        if: matrix.template == 'golang'
        with:
          go-version-file: modular-golang/go.mod
          cache: false
      - uses: actions/setup-dotnet@v4
        if: matrix.template == 'dotnet'
        with:
          global-json-file: modular-NET/global.json
      - uses: actions/setup-java@v4
        if: matrix.template == 'springboot'
        with:
          distribution: temurin
          java-version: '25'
      - uses: shivammathur/setup-php@v2
        if: matrix.template == 'laravel'
        with:
          php-version: '8.5'
          extensions: ctype,curl,dom,fileinfo,mbstring,openssl,pdo,pdo_mysql,pdo_pgsql,tokenizer,xml
          tools: composer:2.9.8
      - uses: actions/setup-python@v5
        if: matrix.template == 'fastapi'
        with:
          python-version: '3.13.3'
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        if: matrix.template == 'fastapi'
        with:
          version: '0.12.21'
      - uses: actions/download-artifact@v4
        with:
          name: cli-package
          path: create-ridhuan-backend/artifact
      - run: npm ci
      - run: npm run build
      - name: Test the release artifact
        env:
          TMP: ${{ runner.temp }}
          TEMP: ${{ runner.temp }}
          TMPDIR: ${{ runner.temp }}
        shell: pwsh
        run: |
          $env:CLI_TARBALL = (Get-ChildItem artifact/*.tgz).FullName
          node scripts/verify-consumer.mjs '${{ matrix.template }}' '${{ matrix.database }}'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: consumer-diagnostics-${{ matrix.os }}-${{ matrix.template }}-${{ matrix.database }}
          path: |
            ${{ runner.temp }}/spring-consumer-logs-*/**
            ${{ runner.temp }}/spring-runtime-*/diagnostics/**
            ${{ runner.temp }}/laravel-consumer-logs-*/**
            ${{ runner.temp }}/laravel-manual-logs-*/**
            ${{ runner.temp }}/laravel-integration-logs-*/**
  macos-smoke:
    if: github.event_name != 'workflow_dispatch' || inputs.verification == 'full' || inputs.verification == 'macos-smoke'
    needs: package
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version: 24.15.0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13.3'
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: '0.12.21'
      - uses: actions/download-artifact@v4
        with:
          name: cli-package
          path: create-ridhuan-backend/artifact
      - run: npm ci
      - run: npm run build
      - run: CLI_TARBALL="$(find artifact -name '*.tgz' -print -quit)" npm test
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: ctype,curl,dom,fileinfo,mbstring,openssl,pdo,pdo_mysql,pdo_pgsql,tokenizer,xml
          tools: composer:2.9.8
      - name: Record native diagnostic paths
        run: |
          node --input-type=module -e 'import {appendFileSync} from "node:fs"; import {tmpdir} from "node:os"; appendFileSync(process.env.GITHUB_ENV,"MACOS_DIAGNOSTICS_ROOT="+tmpdir()+"\n"); console.log({platform:process.platform,arch:process.arch,tmpdir:tmpdir()});'
          java -XshowSettings:properties -version
      - name: Collect all six macOS native consumers
        run: |
          export CLI_TARBALL="$(find artifact -name '*.tgz' -print -quit)"
          node scripts/run-macos-consumer-stage.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: macos-consumer-diagnostics
          path: |
            ${{ env.MACOS_DIAGNOSTICS_ROOT }}/macos-consumer-stage-*/**
            ${{ env.MACOS_DIAGNOSTICS_ROOT }}/spring-consumer-logs-*/**
            ${{ env.MACOS_DIAGNOSTICS_ROOT }}/springboot-consumer-results-*.json
            ${{ env.MACOS_DIAGNOSTICS_ROOT }}/laravel-consumer-logs-*/**
  compose:
    if: github.event_name != 'workflow_dispatch' || inputs.verification != 'macos-smoke'
    needs: package
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      # Each matrix job has its own runner; cap concurrency without sharing RAM.
      max-parallel: 3
      matrix:
        template: ${{ fromJSON(inputs.verification == 'spring-compose' && '["springboot"]' || inputs.verification == 'laravel-compose' && '["laravel"]' || inputs.verification == 'nestjs-compose' && '["nestjs"]' || '["express-typescript","nestjs","golang","dotnet","fastapi","springboot","laravel"]') }}
        database: [postgresql, mysql]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version: 24.15.0
      - uses: actions/setup-python@v5
        if: matrix.template == 'springboot'
        with:
          python-version: '3.13.3'
      - uses: actions/setup-java@v4
        if: matrix.template == 'springboot'
        with:
          distribution: temurin
          java-version: '25'
      - uses: actions/download-artifact@v4
        with:
          name: cli-package
          path: create-ridhuan-backend/artifact
      - run: npm ci
      - run: npm run build
      - name: Collect Compose acceptance
        run: |
          export CLI_TARBALL="$(find artifact -name '*.tgz' -print -quit)"
          if [ "$TEST_GATE_SCOPE" = spring-compose ]; then
            export SPRING_SCENARIOS="${SPRING_TEST_SCENARIOS:-sse-slow-client-write-timeout-and-slot-recovery,outbox-snapshot-delivery-fencing,two-workers-renewal-snapshot-and-accepted-retry,worker-real-lease-renewal-and-compose-graceful-shutdown,shared-redis-quota-across-two-replicas,smtp-starttls-implicit-tls-hostname-verification}"
          fi
          if [ "$TEST_GATE_SCOPE" = laravel-compose ]; then
            node scripts/verify-laravel-compose.mjs '${{ matrix.database }}' --only "${LARAVEL_TEST_SCENARIOS:-redis-shared-quota-cache-outage}"
          else
            node scripts/verify-compose.mjs '${{ matrix.template }}' '${{ matrix.database }}'
          fi
        env:
          TEST_GATE_SCOPE: ${{ inputs.verification }}
          SPRING_TEST_SCENARIOS: ${{ inputs.spring_scenarios }}
          LARAVEL_TEST_SCENARIOS: ${{ inputs.laravel_scenarios }}
          TMP: ${{ runner.temp }}
          TEMP: ${{ runner.temp }}
          TMPDIR: ${{ runner.temp }}
      - name: Confirm task-owned Docker cleanup isolation
        if: always()
        run: node scripts/test-hardening-runner.mjs --docker
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: compose-diagnostics-${{ matrix.template }}-${{ matrix.database }}
          path: |
            ${{ runner.temp }}/spring-runtime-*/diagnostics/**
            ${{ runner.temp }}/laravel-compose-logs-*/**
  publish:
    if: github.event_name == 'workflow_dispatch' && inputs.publish
    needs: [package, consumer, macos-smoke, compose]
    runs-on: ubuntu-latest
    environment: npm-release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: cli-package
          path: artifact
      - uses: actions/setup-node@v4
        with:
          node-version: 24.15.0
          registry-url: https://registry.npmjs.org
      - name: Publish the artifact tested by all jobs
        working-directory: .
        run: npm publish artifact/*.tgz --access public --provenance
