name: CLI template consumers
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/cli-templates.yml
      - create-ridhuan-backend/**
      - .gitmodules
      - .gitattributes
      - .gitignore
      - modular-express-typescript-starter-postgre
      - nestjs
      - modular-golang
      - modular-NET
      - modular-fastapi
  pull_request:
    paths:
      - .github/workflows/cli-templates.yml
      - create-ridhuan-backend/**
      - .gitmodules
      - .gitattributes
      - .gitignore
      - modular-express-typescript-starter-postgre
      - nestjs
      - modular-golang
      - modular-NET
      - modular-fastapi
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the tested artifact (requires npm trusted publisher)
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: cli-${{ github.ref }}
  cancel-in-progress: true
defaults:
  run:
    working-directory: create-ridhuan-backend
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version: 24.15.0
          cache: npm
          cache-dependency-path: create-ridhuan-backend/package-lock.json
      - run: npm ci
      - run: npm run prepare:templates
      - run: npm run build
      - run: npm run test:hardening:runner
      - run: npm test
      - run: npm pack
      - uses: actions/upload-artifact@v4
        with:
          name: cli-package
          path: create-ridhuan-backend/*.tgz
          if-no-files-found: error
  consumer:
    needs: package
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        os: [ubuntu-latest, windows-latest]
        template: [express-typescript, nestjs, golang, dotnet, fastapi]
        database: [postgresql, mysql]
    runs-on: ${{ matrix.os }}
    env:
      CLI_RUNTIME_TEST: ${{ matrix.os == 'ubuntu-latest' && 'true' || 'false' }}
      GOWORK: "off"
      GOMAXPROCS: "2"
      GOMEMLIMIT: 512MiB
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version: 24.15.0
      - uses: actions/setup-go@v5
        if: matrix.template == 'golang'
        with:
          go-version-file: modular-golang/go.mod
          cache: false
      - uses: actions/setup-dotnet@v4
        if: matrix.template == 'dotnet'
        with:
          global-json-file: modular-NET/global.json
      - uses: actions/setup-python@v5
        if: matrix.template == 'fastapi'
        with:
          python-version: '3.13.3'
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        if: matrix.template == 'fastapi'
        with:
          version: '0.12.21'
      - uses: actions/download-artifact@v4
        with:
          name: cli-package
          path: create-ridhuan-backend/artifact
      - run: npm ci
      - run: npm run build
      - name: Test the release artifact
        shell: pwsh
        run: |
          $env:CLI_TARBALL = (Get-ChildItem artifact/*.tgz).FullName
          node scripts/verify-consumer.mjs '${{ matrix.template }}' '${{ matrix.database }}'
  macos-smoke:
    needs: package
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version: 24.15.0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13.3'
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: '0.12.21'
      - uses: actions/download-artifact@v4
        with:
          name: cli-package
          path: create-ridhuan-backend/artifact
      - run: npm ci
      - run: npm run build
      - run: CLI_TARBALL="$(find artifact -name '*.tgz' -print -quit)" npm test
      - name: FastAPI native install and generator smoke
        run: |
          export CLI_TARBALL="$(find artifact -name '*.tgz' -print -quit)"
          node scripts/verify-consumer.mjs fastapi postgresql
          node scripts/verify-consumer.mjs fastapi mysql
  compose:
    needs: package
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      # Each matrix job has its own runner; cap concurrency without sharing RAM.
      max-parallel: 3
      matrix:
        template: [express-typescript, nestjs, golang, dotnet, fastapi]
        database: [postgresql, mysql]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version: 24.15.0
      - uses: actions/download-artifact@v4
        with:
          name: cli-package
          path: create-ridhuan-backend/artifact
      - run: npm ci
      - run: npm run build
      - run: CLI_TARBALL="$(find artifact -name '*.tgz' -print -quit)" node scripts/verify-compose.mjs '${{ matrix.template }}' '${{ matrix.database }}'
      - name: Confirm task-owned Docker cleanup isolation
        if: always()
        run: node scripts/test-hardening-runner.mjs --docker
  publish:
    if: github.event_name == 'workflow_dispatch' && inputs.publish
    needs: [package, consumer, macos-smoke, compose]
    runs-on: ubuntu-latest
    environment: npm-release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: cli-package
          path: artifact
      - uses: actions/setup-node@v4
        with:
          node-version: 24.15.0
          registry-url: https://registry.npmjs.org
      - name: Publish the artifact tested by all jobs
        working-directory: .
        run: npm publish artifact/*.tgz --access public --provenance
