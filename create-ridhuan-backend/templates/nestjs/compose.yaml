services:
  postgres:
    image: postgres:18.1-bookworm
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-backend}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-backend}
      POSTGRES_DB: ${POSTGRES_DB:-backend}
      TZ: UTC
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-backend} -d ${POSTGRES_DB:-backend}"]
      interval: 5s
      timeout: 3s
      retries: 20

  migrate:
    build:
      context: .
      target: migration
    environment:
      DATABASE_URL: ${DATABASE_URL_DOCKER:-postgresql://backend:backend@postgres:5432/backend?schema=public}
    depends_on:
      postgres:
        condition: service_healthy
    command: ["node_modules/.bin/prisma", "migrate", "deploy"]
    restart: "no"

  app:
    build: .
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: 3000
      DATABASE_URL: ${DATABASE_URL_DOCKER:-postgresql://backend:backend@postgres:5432/backend?schema=public}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      JWT_ISSUER: ${JWT_ISSUER:-modular-nestjs}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-modular-nestjs-api}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
      ENDPOINT_POLICIES_JSON: ${ENDPOINT_POLICIES_JSON:-{}}
      APP_INSTANCE_COUNT: ${APP_INSTANCE_COUNT:-1}
      TRUST_PROXY_HOPS: ${TRUST_PROXY_HOPS:-0}
      RATE_LIMIT_STORE: ${RATE_LIMIT_STORE:-memory}
      RATE_LIMIT_AUTH_WINDOW_MS: ${RATE_LIMIT_AUTH_WINDOW_MS:-900000}
      RATE_LIMIT_AUTH_MAX: ${RATE_LIMIT_AUTH_MAX:-20}
      RATE_LIMIT_PUBLIC_WINDOW_MS: ${RATE_LIMIT_PUBLIC_WINDOW_MS:-900000}
      RATE_LIMIT_PUBLIC_MAX: ${RATE_LIMIT_PUBLIC_MAX:-100}
      RATE_LIMIT_INTERNAL_WINDOW_MS: ${RATE_LIMIT_INTERNAL_WINDOW_MS:-900000}
      RATE_LIMIT_INTERNAL_MAX: ${RATE_LIMIT_INTERNAL_MAX:-300}
      REDIS_URL: ${REDIS_URL_DOCKER:-redis://redis:6379}
      REDIS_NAMESPACE: ${REDIS_NAMESPACE:-modular-nestjs}
      CACHE_ENABLED: ${CACHE_ENABLED:-false}
      UPLOAD_ENABLED: ${UPLOAD_ENABLED:-true}
      UPLOAD_STORAGE: ${UPLOAD_STORAGE:-local}
      UPLOAD_LOCAL_DIR: /app/uploads
      UPLOAD_MAX_BYTES: ${UPLOAD_MAX_BYTES:-10485760}
      UPLOAD_ALLOWED_MIME: ${UPLOAD_ALLOWED_MIME:-image/png,image/jpeg,application/pdf}
      UPLOAD_ORPHAN_GRACE_HOURS: ${UPLOAD_ORPHAN_GRACE_HOURS:-24}
      S3_ENDPOINT: ${S3_ENDPOINT_DOCKER:-http://minio:9000}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_BUCKET: ${S3_BUCKET:-uploads}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-minioadmin}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-minioadmin}
      S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-true}
      SMTP_ENABLED: ${SMTP_ENABLED:-false}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
    ports:
      - "${APP_PORT:-3000}:3000"
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 12

  redis:
    image: redis:7.4.5-alpine
    profiles: ["redis"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
    profiles: ["s3"]
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY_ID:-minioadmin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_ACCESS_KEY:-minioadmin}
    volumes:
      - minio_data:/data
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"

volumes:
  postgres_data:
  uploads_data:
  redis_data:
  minio_data:
