name: NestJS template CI
on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.1-bookworm
        env:
          POSTGRES_USER: backend
          POSTGRES_PASSWORD: backend
          POSTGRES_DB: backend
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U backend -d backend"
          --health-interval 5s --health-timeout 3s --health-retries 20
      redis:
        image: redis:7.4.5-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://backend:backend@127.0.0.1:5432/backend?schema=public
      JWT_SECRET: ci_secret_0123456789_abcdefghijklmnopqrstuvwxyz
      CORS_ORIGINS: http://localhost:5173
      ADMIN_EMAIL: admin@example.com
      ADMIN_PASSWORD: ci_admin_password_0123456789
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.15.0
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run prisma:validate
      - run: npm run build
      - run: npm run typecheck
      - run: npm run verify:contract
      - run: npm test
      - name: Fresh migration and seed
        run: |
          npm run prisma:migrate:deploy
          npm run seed
          npm run seed
      - name: Database-backed HTTP tests
        run: npm run test:database
      - name: Shared Redis rate limit
        run: npm run test:redis
      - name: Start MinIO
        run: |
          docker run -d --name nestjs-ci-minio -p 9000:9000 \
            -e MINIO_ROOT_USER=minioadmin -e MINIO_ROOT_PASSWORD=minioadmin \
            quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z server /data
          for attempt in $(seq 1 30); do curl --fail --silent http://127.0.0.1:9000/minio/health/live && break; sleep 2; done
          curl --fail --silent http://127.0.0.1:9000/minio/health/live >/dev/null
      - name: S3 upload with MinIO
        run: npm run test:s3
      - run: npm run api-docs
      - name: Check OpenAPI operations
        run: node -e "const d=require('./openapi.json');const r=require('./dist/common/endpoint/endpoint.registry');const count=Object.values(d.paths).flatMap(p=>['get','post','patch','delete'].filter(m=>p[m])).length;if(count!==Object.keys(r.endpointRegistry).length)process.exit(1)"
      - name: Check container build
        run: docker build --pull -t nestjs-template:ci .
      - name: Compose startup follows one-shot migration
        run: |
          docker compose -f compose.yaml up -d --build --wait app
          curl --fail --silent http://127.0.0.1:3000/ready >/dev/null
      - name: Stop Compose smoke stack
        if: always()
        run: docker compose -f compose.yaml down --volumes

  upgrade:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.1-bookworm
        env:
          POSTGRES_USER: backend
          POSTGRES_PASSWORD: backend
          POSTGRES_DB: backend
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U backend -d backend"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      DATABASE_URL: postgresql://backend:backend@127.0.0.1:5432/backend?schema=public
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.15.0
          cache: npm
      - run: npm ci
      - name: Apply initial migration and mark it applied
        run: |
          PGPASSWORD=backend psql -h 127.0.0.1 -U backend -d backend -f prisma/migrations/20260929000000_init/migration.sql
          npx prisma migrate resolve --applied 20260929000000_init
      - name: Preserve existing data through upgrade
        run: |
          PGPASSWORD=backend psql -h 127.0.0.1 -U backend -d backend -c "INSERT INTO roles (id,name,\"updatedAt\") VALUES ('00000000-0000-4000-8000-000000000001','legacy',NOW())"
          npm run prisma:migrate:deploy
          test "$(PGPASSWORD=backend psql -h 127.0.0.1 -U backend -d backend -Atc 'SELECT count(*) FROM roles WHERE name=''legacy''')" = 1
