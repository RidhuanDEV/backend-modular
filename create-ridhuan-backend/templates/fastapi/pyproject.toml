[project]
name = "modular-fastapi"
version = "0.1.0"
description = "Typed modular FastAPI backend with PostgreSQL or MySQL"
requires-python = ">=3.13,<3.14"
license = "MIT"
dependencies = [
  "fastapi>=0.135,<0.140",
  "uvicorn>=0.34,<1",
  "pydantic-settings>=2.8,<3",
  "sqlalchemy[asyncio]>=2.0.39,<2.1",
  "alembic>=1.15,<2",
  "PyJWT[crypto]>=2.10,<3",
  "pwdlib[argon2]>=0.2,<1",
  "redis>=5.2,<8",
  "boto3>=1.37,<2",
  "python-multipart>=0.0.20,<1",
  "aiosmtplib>=4,<6",
  "email-validator>=2.2,<3",
  "tzdata>=2025.1",
]

[project.optional-dependencies]
postgresql = ["psycopg[binary]>=3.2,<4"]
mysql = ["aiomysql>=0.2,<1"]

[dependency-groups]
dev = ["ruff>=0.11,<1", "pyright>=1.1.398,<2", "pytest>=8.3,<10", "httpx>=0.28,<1", "pytest-asyncio>=0.26,<2", "pip-audit>=2.8,<3", "boto3-stubs-lite[s3]>=1.37,<2"]

[project.scripts]
backend = "app.cli.main:main"

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/app"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
ignore = ["E501"]

[tool.pyright]
include = ["src", "tests", "scripts"]
typeCheckingMode = "strict"
pythonVersion = "3.13"
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
