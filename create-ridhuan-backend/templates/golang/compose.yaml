services:
  postgres:
    image: postgres:18.3-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-backend}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-backend}
      POSTGRES_DB: ${POSTGRES_DB:-backend}
    ports:
    - 127.0.0.1:${POSTGRES_PORT:-5432}:5432
    volumes:
    - postgres_data:/var/lib/postgresql
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 5s
      timeout: 3s
      retries: 15
  migrate:
    build: .
    entrypoint:
    - migrate
    environment:
      DATABASE_URL: ${DATABASE_URL_DOCKER:?Set DATABASE_URL_DOCKER}
    depends_on:
      postgres:
        condition: service_healthy
    restart: 'no'
  app:
    build: .
    env_file:
    - .env
    environment:
      PORT: '8080'
      DATABASE_URL: ${DATABASE_URL_DOCKER:?Set DATABASE_URL_DOCKER}
      REDIS_URL: redis://redis:6379
      S3_ENDPOINT: ${S3_ENDPOINT_DOCKER:-http://minio:9000}
      UPLOAD_LOCAL_DIR: /app/uploads
      NODE_ENV: ${NODE_ENV:-development}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT_DOCKER:-http://otel-collector:4318}
    ports:
    - ${APP_PORT:-8080}:8080
    volumes:
    - uploads_data:/app/uploads
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
        required: false
      minio-init:
        condition: service_completed_successfully
        required: false
    restart: unless-stopped
    healthcheck:
      test:
      - CMD
      - wget
      - -q
      - -O
      - /dev/null
      - http://localhost:8080/ready
      interval: 15s
      timeout: 3s
      retries: 3
  redis:
    image: redis:8.6.1-alpine
    profiles:
    - redis
    ports:
    - 127.0.0.1:${REDIS_PORT:-6379}:6379
    volumes:
    - redis_data:/data
    healthcheck:
      test:
      - CMD
      - redis-cli
      - ping
      interval: 5s
      timeout: 3s
      retries: 20
  minio:
    build:
      context: .
      dockerfile: scripts/minio.Dockerfile
      target: server
    profiles:
    - minio
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY_ID:-minioadmin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_ACCESS_KEY:-minioadmin}
    ports:
    - 127.0.0.1:${MINIO_PORT:-9000}:9000
    - 127.0.0.1:${MINIO_CONSOLE_PORT:-9001}:9001
    volumes:
    - minio_data:/data
    healthcheck:
      test:
      - CMD
      - wget
      - -q
      - -O
      - /dev/null
      - http://localhost:9000/minio/health/live
      interval: 5s
      timeout: 3s
      retries: 30
  minio-init:
    build:
      context: .
      dockerfile: scripts/minio.Dockerfile
      target: client
    profiles:
    - minio
    entrypoint:
    - /bin/sh
    - /init-bucket.sh
    environment:
      MC_CONFIG_DIR: /tmp/mc
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY}
      S3_BUCKET: ${S3_BUCKET:-uploads}
    volumes:
    - ./scripts/init-bucket.sh:/init-bucket.sh:ro
    depends_on:
      minio:
        condition: service_healthy
    restart: 'no'
  worker:
    build: .
    env_file:
    - .env
    environment:
      PORT: '8080'
      DATABASE_URL: ${DATABASE_URL_DOCKER:?Set DATABASE_URL_DOCKER}
      REDIS_URL: redis://redis:6379
      S3_ENDPOINT: ${S3_ENDPOINT_DOCKER:-http://minio:9000}
      UPLOAD_LOCAL_DIR: /app/uploads
      NODE_ENV: ${NODE_ENV:-development}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT_DOCKER:-http://otel-collector:4318}
    volumes:
    - uploads_data:/app/uploads
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: on-failure
    entrypoint:
    - worker
    stop_grace_period: 60s
  otel-collector:
    image: ghcr.io/open-telemetry/opentelemetry-collector-releases/opentelemetry-collector:0.162.0
    profiles:
    - telemetry
    command:
    - --config=/etc/otelcol/config.yaml
    volumes:
    - ./scripts/otel-collector.yaml:/etc/otelcol/config.yaml:ro
    ports:
    - 127.0.0.1:${OTEL_GRPC_PORT:-4317}:4317
    - 127.0.0.1:${OTEL_HTTP_PORT:-4318}:4318
    restart: unless-stopped
volumes:
  postgres_data: null
  uploads_data: null
  redis_data: null
  minio_data: null
