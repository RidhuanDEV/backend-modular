pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 256; }
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    log_format safe '$request_method $uri $status $request_time';
    access_log /dev/stdout safe;
    client_body_temp_path /tmp/nginx/body;
    fastcgi_temp_path /tmp/nginx/fastcgi;
    proxy_temp_path /tmp/nginx/proxy;
    uwsgi_temp_path /tmp/nginx/uwsgi;
    scgi_temp_path /tmp/nginx/scgi;
    client_max_body_size 11m;
    send_timeout 15s;
    gzip off;
    resolver 127.0.0.11 valid=5s ipv6=off;
    resolver_timeout 2s;
    upstream backend_fpm {
        zone backend_fpm 64k;
        server app:9000 resolve;
        # Nginx>=1.29.7 caches32 connections by default; FPM closes each response.
        # Avoid stale FastCGI sockets and keep idle sockets out of the FPM budget.
        keepalive 0;
    }
    server {
        listen 8080;
        root /var/www/html/public;
        index index.php;
        location ~ /\. { deny all; }
        location ~ ^/(vendor|storage|bootstrap|config|database)(/|$) { return 404; }
        location / { try_files $uri $uri/ /index.php?$query_string; }
        location = /index.php {
            include fastcgi_params;
            fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
            fastcgi_param HTTP_PROXY "";
            fastcgi_pass backend_fpm;
            fastcgi_buffering off;
            fastcgi_request_buffering on;
            fastcgi_read_timeout 900s;
        }
        location ~ \.php$ { return 404; }
    }
}
