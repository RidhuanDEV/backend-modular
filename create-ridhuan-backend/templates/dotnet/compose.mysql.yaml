services:
  migrate:
    build: .
    entrypoint:
    - dotnet
    - /app/migrator/ModularBackend.Migrator.dll
    environment:
      Database__ConnectionString: ${Database__ConnectionString_DOCKER:?Set Database__ConnectionString_DOCKER}
      Database__Provider: mysql
    depends_on:
      mysql:
        condition: service_healthy
    restart: 'no'
  app:
    build: .
    env_file: .env
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      Database__ConnectionString: ${Database__ConnectionString_DOCKER:?Set Database__ConnectionString_DOCKER}
      Redis__ConnectionString: redis:6379
      Upload__LocalRoot: /app/uploads
      Upload__Endpoint: ${S3_ENDPOINT_DOCKER-http://s3mock:9090}
      Database__Provider: mysql
    ports:
    - ${APP_PORT:-5080}:8080
    volumes:
    - uploads_data:/app/uploads
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
        required: false
      s3mock:
        condition: service_healthy
        required: false
    healthcheck:
      test:
      - CMD
      - curl
      - --fail
      - --silent
      - --max-time
      - '2'
      - http://localhost:8080/ready
      interval: 10s
      timeout: 3s
      retries: 12
    restart: unless-stopped
  seeder:
    build: .
    profiles:
    - seed
    entrypoint:
    - dotnet
    - /app/seeder/ModularBackend.Seeder.dll
    env_file: .env
    environment:
      Database__ConnectionString: ${Database__ConnectionString_DOCKER:?Set Database__ConnectionString_DOCKER}
      Database__Provider: mysql
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: 'no'
  redis:
    image: redis:8.6.1-alpine
    profiles:
    - redis
    ports:
    - 127.0.0.1:${REDIS_PORT:-56379}:6379
    healthcheck:
      test:
      - CMD
      - redis-cli
      - ping
      interval: 3s
      timeout: 3s
      retries: 20
  s3mock:
    image: adobe/s3mock:5.2.2
    profiles:
    - s3
    environment:
      COM_ADOBE_TESTING_S3MOCK_STORE_INITIAL_BUCKETS: ${Upload__Bucket:-uploads}
    ports:
    - 127.0.0.1:${S3_PORT:-19000}:9090
    healthcheck:
      test:
      - CMD
      - wget
      - --spider
      - -q
      - http://localhost:9090/favicon.ico
      interval: 3s
      timeout: 3s
      retries: 20
  mysql:
    image: mysql:8.4@sha256:6ea90827b1100f8f2ae306a539f86d2c264a26ed435a2a9f75551dd5c3aeb242
    command:
    - --character-set-server=utf8mb4
    - --collation-server=utf8mb4_bin
    - --default-time-zone=+00:00
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-backend}
      MYSQL_USER: ${MYSQL_USER:-backend}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD}
    ports:
    - 127.0.0.1:${MYSQL_PORT:-3306}:3306
    volumes:
    - mysql_data:/var/lib/mysql
    - ./scripts/mysql-entrypoint.sh:/opt/template/mysql-entrypoint.sh:ro
    - ./scripts/mysql-init-user.sh:/docker-entrypoint-initdb.d/10-app-user.sh:ro
    healthcheck:
      test:
      - CMD-SHELL
      - MYSQL_PWD="$${MYSQL_PASSWORD}" mysql -h 127.0.0.1 -u "$${MYSQL_USER}" "$${MYSQL_DATABASE}"
        -e "SELECT 1"
      interval: 5s
      timeout: 3s
      retries: 30
    entrypoint:
    - /bin/bash
    - /opt/template/mysql-entrypoint.sh
volumes:
  uploads_data: null
  mysql_data: null
